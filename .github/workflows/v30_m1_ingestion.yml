name: V30 M1 OSM ingestion
on:
  push:
    branches: [v30-work-m1-ingestion]
    paths: ["v30/maps/**", "v30/tests/**", ".github/workflows/v30_m1_ingestion.yml"]
  pull_request:
    branches: [v30-work-m1-ingestion]
    paths: ["v30/maps/**", "v30/tests/fixtures/**", ".github/workflows/v30_m1_ingestion.yml"]
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Test OSM XML ingestion
        run: python -m unittest v30/tests/test_osm_ingest.py
