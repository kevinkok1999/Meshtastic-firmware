name: V30 F1 transport validation

on:
  push:
    branches: [v30-f1-dispatch-hook]
    paths: ["v30/**", ".github/workflows/v30_validation.yml"]
  pull_request:
    branches: [v30-f1-dispatch-hook]
    paths: ["v30/**", ".github/workflows/v30_validation.yml"]
  workflow_dispatch:

concurrency:
  group: meshoffgridnl-v30-dispatch-hook
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  f1-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run F1 transport corpus
        run: python v30/tests/test_transport.py
      - name: Verify pinned Dispatcher hook candidate
        run: python v30/tests/test_dispatch_patch.py
      - name: Assert immutable dependency pins
        run: |
          grep -F 'WADAMESH_SHA = "6fe6b9f06332708b6ed0cc78958017d0dcc9e35d"' v30/apply_v30.py
          grep -F 'MESHCORE_SHA = "edd7ed47f42acf6c64c9fcac551050fdbd531a09"' v30/apply_v30.py
      - name: Compile host adapter with exact warnings
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I v30/overlay/src/helpers/esp32 v30/tests/test_transport.cpp v30/overlay/src/helpers/esp32/V30EmergencyTransport.cpp -o /tmp/v30-transport
          /tmp/v30-transport
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic v30/tests/test_tx_binding.cpp -o /tmp/v30-tx-binding
          /tmp/v30-tx-binding

  v29-to-v30-build:
    name: Pinned V11-V29 baseline with opt-in hook compile
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Checkout immutable WadaMesh baseline
        run: |
          git clone --no-checkout https://github.com/ALLFATHER-BV/wadamesh.git upstream-wadamesh
          git -C upstream-wadamesh fetch --depth 1 origin 6fe6b9f06332708b6ed0cc78958017d0dcc9e35d
          git -C upstream-wadamesh checkout --detach 6fe6b9f06332708b6ed0cc78958017d0dcc9e35d
          test "$(git -C upstream-wadamesh rev-parse HEAD)" = "6fe6b9f06332708b6ed0cc78958017d0dcc9e35d"
      - name: Apply V11 through V29 baseline
        run: |
          set -euo pipefail
          for patch in v11 v12 v13 v15 v16 v17 v18 v19 v26 v27 v28 v29; do
            python "$patch/apply_$patch.py" upstream-wadamesh
          done
      - name: Run V29 contracts before V30 overlay
        run: |
          python v29/tests/test_contracts.py upstream-wadamesh
          python v29/tests/test_resilience_model.py upstream-wadamesh
      - name: Apply gated V30 overlay
        run: python v30/apply_v30.py upstream-wadamesh
      - name: Stage opt-in pinned Dispatcher hook
        run: |
          cp v30/extra_scripts/v30_dispatch_patch.py upstream-wadamesh/v30_dispatch_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path("upstream-wadamesh/platformio.ini")
          text = p.read_text(encoding="utf-8")
          start = text.find("[env:LilyGo_TDeck_companion_radio_touch]")
          end = text.find("[env:LilyGo_TDeck_Pro_companion_radio_touch]", start)
          if start < 0 or end < 0:
              raise SystemExit("T-Deck environment missing")
          block = text[start:end]
          if "custom_v30_dispatch_patch" in block:
              raise SystemExit("hook already staged")
          lines = block.splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith("extra_scripts = "):
                  if "pre:v30_dispatch_patch.py" in line:
                      raise SystemExit("hook already staged")
                  lines[i] = line.rstrip("\\n") + ", pre:v30_dispatch_patch.py\\n"
                  break
          else:
              raise SystemExit("T-Deck extra_scripts option missing")
          block = "".join(lines)
          section_end = block.find("\\n", block.find("]")) + 1
          block = block[:section_end] + "custom_v30_dispatch_patch = 1\\n" + block[section_end:]
          p.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY
      - name: Build DEV firmware with hook only
        working-directory: upstream-wadamesh
        env:
          PLATFORMIO_BUILD_FLAGS: >-
            -DMESH_OFFGRIDNL_V30_EXPERIMENTAL=0
            -DFIRMWARE_RELEASE_TAG='"v30-f1-hook"'
            -DFIRMWARE_VERSION='"MeshOffGridNL V30 F1 HOOK"'
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.2.0" --no-build-isolation
          pio run -e LilyGo_TDeck_companion_radio_touch
      - name: Assert embedded Dispatcher hook was applied
        run: |
          header=$(grep -R -F -l "virtual void onV30TxComplete" upstream-wadamesh/.pio/libdeps | head -n1)
          source=$(grep -R -F -l "onV30TxComplete(outbound" upstream-wadamesh/.pio/libdeps | head -n1)
          test -n "$header" && test -n "$source"
          test "$(grep -F -c "onV30TxComplete" "$header")" -eq 1
          test "$(grep -F -c "onV30TxComplete(outbound" "$source")" -eq 3
          test "$(grep -F -c "onV30TxAdmission" "$header")" -eq 1
          test "$(grep -F -c "onV30TxDropped" "$header")" -eq 1
          test "$(grep -F -c "onV30TxAdmission(outbound" "$source")" -eq 1
          test "$(grep -F -c "onV30TxDropped(outbound" "$source")" -eq 2
          printf "header=%s\\nsource=%s\\n" "$header" "$source"
      - name: Guard DEV app headroom
        run: |
          test -f upstream-wadamesh/.pio/build/LilyGo_TDeck_companion_radio_touch/firmware.bin
          size=$(stat -c%s upstream-wadamesh/.pio/build/LilyGo_TDeck_companion_radio_touch/firmware.bin)
          test "$size" -lt $((0x3E0000-262144))
