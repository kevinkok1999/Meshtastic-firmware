name: V30 F1 transport validation

on:
  push:
    branches:
      - v30-pro-meshmap-nano
    paths:
      - "v30/**"
      - ".github/workflows/v30_validation.yml"
  pull_request:
    branches:
      - v30-pro-meshmap-nano
    paths:
      - "v30/**"
      - ".github/workflows/v30_validation.yml"
  workflow_dispatch:

concurrency:
  group: meshoffgridnl-v30-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  f1-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run F1 red-green transport corpus
        run: python v30/tests/test_transport.py
      - name: Assert immutable dependency pins
        run: |
          grep -F 'WADAMESH_SHA = "6fe6b9f06332708b6ed0cc78958017d0dcc9e35d"' v30/apply_v30.py
          grep -F 'MESHCORE_SHA = "edd7ed47f42acf6c64c9fcac551050fdbd531a09"' v30/apply_v30.py
      - name: Build host fixture with exact warnings
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror v30/tests/test_transport.cpp -o /tmp/v30-transport
          /tmp/v30-transport
