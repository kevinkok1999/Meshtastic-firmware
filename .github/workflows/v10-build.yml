name: V10 DirectLink Build

on:
  push:
    branches:
      - v10-dev
    paths:
      - 'v10-overlay/**'
      - 'v10/**'
      - '.github/workflows/v10-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v10-firmware
  cancel-in-progress: true

jobs:
  build-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout V10 control repository
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 0

      - name: Checkout exact Saitama v1.3.0
        uses: actions/checkout@v4
        with:
          repository: 868meshbot/Saitama
          ref: v1.3.0
          path: saitama
          submodules: recursive
          fetch-depth: 0

      - name: Verify locked upstream provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C saitama rev-parse HEAD)" = "16598b4e6a7eabd6195d06d2a3abc1b3b448f368"
          test "$(git -C saitama/lib/MeshCore rev-parse HEAD)" = "d92964352441e53b93e8667b802e04f6e072b39e"

      - name: Apply V7 to V10 overlays
        shell: bash
        run: |
          set -euo pipefail
          python control/v7-overlay/apply_v7.py saitama control/v7-overlay
          python control/v8-overlay/apply_v8.py saitama control/v8-overlay
          python control/v9-overlay/apply_v9.py saitama control/v9-overlay
          python control/v10-overlay/apply_v10.py saitama control/v10-overlay
          grep -q 'OPS_VERSION_STRING "10.0.0"' saitama/src/version.h
          grep -q 'Wi-Fi LR Direct engine ready' saitama/src/mesh/MeshService.cpp

      - name: Run host DirectLink tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v10-tests
          g++ -std=c++11 -Wall -Wextra -Werror             control/v10-overlay/V10DirectLinkCore.cpp             control/v10-overlay/test_v10_core.cpp             -Icontrol/v10-overlay             -o /tmp/v10-tests/v10-core-tests
          /tmp/v10-tests/v10-core-tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.piocache
          key: ${{ runner.os }}-v10-pio-${{ hashFiles('saitama/platformio.ini', 'control/v10-overlay/**') }}
          restore-keys: |
            ${{ runner.os }}-v10-pio-
            ${{ runner.os }}-v9-pio-
            ${{ runner.os }}-v8-pio-

      - name: Build exactly one T-Deck target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.piocache
          export PLATFORMIO_BUILD_CACHE_DIR=~/.piocache
          cd saitama
          pio run -e t-deck

      - name: Validate V10 firmware images
        shell: bash
        run: |
          set -euo pipefail
          cd saitama
          APP="firmware/saitama-t-deck-plus-10.0.0.bin"
          MERGED="firmware/saitama-t-deck-plus-10.0.0-merged.bin"
          test -s "$APP"
          test -s "$MERGED"
          python -m esptool --chip esp32s3 image_info .pio/build/t-deck/bootloader.bin > ../v10-image-info.txt
          grep -qi "dio" ../v10-image-info.txt
          APP_BYTES="$(stat -c%s "$APP")"
          MERGED_BYTES="$(stat -c%s "$MERGED")"
          APP_SHA="$(sha256sum "$APP" | awk '{print $1}')"
          MERGED_SHA="$(sha256sum "$MERGED" | awk '{print $1}')"
          {
            echo "version=10.0.0"
            echo "upstream_saitama=16598b4e6a7eabd6195d06d2a3abc1b3b448f368"
            echo "meshcore=d92964352441e53b93e8667b802e04f6e072b39e"
            echo "base_v9=d24bd9910b53589652778ff79fc7da795d790c07"
            echo "target=t-deck-plus"
            echo "flash_size=16MB"
            echo "flash_mode=dio"
            echo "routes=lora,espnow_lr,wifi_lr_direct"
            echo "experimental_gates=gfsk_direct,ble_coded"
            echo "app_bytes=$APP_BYTES"
            echo "merged_bytes=$MERGED_BYTES"
            echo "app_sha256=$APP_SHA"
            echo "merged_sha256=$MERGED_SHA"
            echo "source_commit=${GITHUB_SHA}"
          } | tee ../v10-release-metadata.txt

      - name: Prepare V10 immutable asset tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v10publish/firmware/v10
          cp saitama/firmware/saitama-t-deck-plus-10.0.0.bin /tmp/v10publish/firmware/v10/
          cp saitama/firmware/saitama-t-deck-plus-10.0.0-merged.bin /tmp/v10publish/firmware/v10/
          cp v10-release-metadata.txt /tmp/v10publish/firmware/v10/
          cp v10-image-info.txt /tmp/v10publish/firmware/v10/

      - name: Publish V10 assets only after validation
        shell: bash
        run: |
          set -euo pipefail
          cd control
          git switch --orphan v10-assets-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/v10publish/. .
          git add firmware/v10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(v10): publish validated 10.0.0 firmware"
          git push origin HEAD:refs/heads/v10-assets --force

      - name: Upload V10 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshoffgridnl-v10-firmware
          if-no-files-found: error
          retention-days: 90
          path: |
            saitama/firmware/saitama-t-deck-plus-10.0.0.bin
            saitama/firmware/saitama-t-deck-plus-10.0.0-merged.bin
            v10-release-metadata.txt
            v10-image-info.txt
