name: V29 Emergency Fabric Validation

on:
  push:
    branches:
      - v29-emergency-fabric
    paths:
      - "v29/**"
      - ".github/workflows/v29_validation.yml"
  workflow_dispatch:

concurrency:
  group: meshoffgridnl-v29-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-v29:
    name: V28 baseline + V29 offline emergency core
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout firmware workspace
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch pinned WadaMesh beta_83
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream-wadamesh
          git clone --depth 1 --branch beta_83 https://github.com/ALLFATHER-BV/wadamesh.git upstream-wadamesh
          cd upstream-wadamesh
          test "$(git rev-parse HEAD)" = "6fe6b9f06332708b6ed0cc78958017d0dcc9e35d"

      - name: Apply V11 through V29
        shell: bash
        run: |
          set -euo pipefail
          python v11/apply_v11.py upstream-wadamesh
          python v12/apply_v12.py upstream-wadamesh
          python v13/apply_v13.py upstream-wadamesh
          python v15/apply_v15.py upstream-wadamesh
          python v16/apply_v16.py upstream-wadamesh
          python v17/apply_v17.py upstream-wadamesh
          python v18/apply_v18.py upstream-wadamesh
          python v19/apply_v19.py upstream-wadamesh
          python v26/apply_v26.py upstream-wadamesh
          python v27/apply_v27.py upstream-wadamesh
          python v28/apply_v28.py upstream-wadamesh
          python v29/apply_v29.py upstream-wadamesh

      - name: Run V29 contracts
        shell: bash
        run: |
          set -euo pipefail
          python v29/tests/test_contracts.py upstream-wadamesh
          python v28/tests/test_contracts.py upstream-wadamesh
          python v26/tests/test_contracts.py upstream-wadamesh

      - name: Verify pinned P1 Pro V8 RF contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url="https://raw.githubusercontent.com/kevinkok1999/Meshtastic-firmware/c2d99ac83d702de0f9e8cb66e0f9bff2cb283360/p1pro-v8/profile.json"
          with urllib.request.urlopen(url, timeout=20) as r:
              p=json.load(r)
          rf=p["radioProfile"]
          assert rf["frequencyMHz"] == 869.618
          assert rf["bandwidthKHz"] == 62.5
          assert rf["spreadingFactor"] == 8
          assert rf["codingRate"] == 5
          assert rf["txPowerMaxDbm"] == 22
          assert rf["locked"] is True
          print("P1 Pro V8 contract OK")
          PY

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U --no-build-isolation --no-cache-dir "setuptools<72"
          pip install -U platformio --no-build-isolation

      - name: Build V29 T-Deck Plus
        env:
          PLATFORMIO_BUILD_FLAGS: >-
            -DFIRMWARE_RELEASE_TAG='"mog-v29.0.0-dev"'
            -DFIRMWARE_VERSION='"MeshOffGridNL V29 Emergency Fabric DEV"'
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-wadamesh
          pio run -e LilyGo_TDeck_companion_radio_touch

      - name: Guard image size
        shell: bash
        run: |
          set -euo pipefail
          BIN=upstream-wadamesh/.pio/build/LilyGo_TDeck_companion_radio_touch/firmware.bin
          test -f "$BIN"
          SIZE=$(stat -c%s "$BIN")
          test "$SIZE" -lt $((0x3E0000))
          sha256sum "$BIN"
