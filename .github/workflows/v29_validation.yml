name: V29 Emergency Fabric Validation

on:
  push:
    branches:
      - v29-emergency-fabric
    paths:
      - "v29/apply_v29.py"
      - "v29/overlay/**"
      - "v29/tests/**"
      - ".github/workflows/v29_validation.yml"
  workflow_dispatch:

concurrency:
  group: meshoffgridnl-v29-validation
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  validate-v29:
    name: V28 baseline + V29 offline emergency core
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout firmware workspace
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch pinned WadaMesh beta_83
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream-wadamesh
          git clone --depth 1 --branch beta_83 https://github.com/ALLFATHER-BV/wadamesh.git upstream-wadamesh
          cd upstream-wadamesh
          test "$(git rev-parse HEAD)" = "6fe6b9f06332708b6ed0cc78958017d0dcc9e35d"

      - name: Apply V11 through V29
        shell: bash
        run: |
          set -euo pipefail
          python v11/apply_v11.py upstream-wadamesh
          python v12/apply_v12.py upstream-wadamesh
          python v13/apply_v13.py upstream-wadamesh
          python v15/apply_v15.py upstream-wadamesh
          python v16/apply_v16.py upstream-wadamesh
          python v17/apply_v17.py upstream-wadamesh
          python v18/apply_v18.py upstream-wadamesh
          python v19/apply_v19.py upstream-wadamesh
          python v26/apply_v26.py upstream-wadamesh
          python v27/apply_v27.py upstream-wadamesh
          python v28/apply_v28.py upstream-wadamesh
          python v29/apply_v29.py upstream-wadamesh

      - name: Run V29 contracts
        shell: bash
        run: |
          set -euo pipefail
          python v29/tests/test_contracts.py upstream-wadamesh
          python v29/tests/test_resilience_model.py upstream-wadamesh
          python v29/tests/test_portal_behavior.py
          # V27's historical standalone suite targets its pre-V28 overlay and
          # rejects legitimate V28/V29 changes. Validate it on a V27-only
          # patched checkout in a separate targeted job, not on the V29 tree.
          python v28/tests/test_contracts.py upstream-wadamesh
          python v26/tests/test_contracts.py upstream-wadamesh

      - name: Verify pinned P1 Pro V8 RF contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url="https://raw.githubusercontent.com/kevinkok1999/Meshtastic-firmware/c2d99ac83d702de0f9e8cb66e0f9bff2cb283360/p1pro-v8/profile.json"
          with urllib.request.urlopen(url, timeout=20) as r:
              p=json.load(r)
          rf=p["radioProfile"]
          assert rf["frequencyMHz"] == 869.618
          assert rf["bandwidthKHz"] == 62.5
          assert rf["spreadingFactor"] == 8
          assert rf["codingRate"] == 5
          assert rf["txPowerMaxDbm"] == 22
          assert rf["locked"] is True
          print("P1 Pro V8 contract OK")
          PY

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U --no-build-isolation --no-cache-dir "setuptools<72"
          pip install -U platformio --no-build-isolation

      - name: Build V29 T-Deck Plus
        env:
          PLATFORMIO_BUILD_FLAGS: >-
            -DFIRMWARE_RELEASE_TAG='"mog-v29.0.0-dev"'
            -DFIRMWARE_VERSION='"MeshOffGridNL V29 Emergency Fabric DEV"'
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-wadamesh
          pio run -e LilyGo_TDeck_companion_radio_touch

      - name: Guard image size
        shell: bash
        run: |
          set -euo pipefail
          BIN=upstream-wadamesh/.pio/build/LilyGo_TDeck_companion_radio_touch/firmware.bin
          test -f "$BIN"
          SIZE=$(stat -c%s "$BIN")
          test "$SIZE" -lt $((0x3E0000))
          sha256sum "$BIN"
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          build = pathlib.Path("upstream-wadamesh/.pio/build/LilyGo_TDeck_companion_radio_touch")
          # ESP32-S3 standard app-only image is NOT a complete USB flash bundle.
          # Fail closed when the bootloader/partition artifacts are absent.
          required = {
              "bootloader": (build / "bootloader.bin", 0x0000),
              "partitions": (build / "partitions.bin", 0x8000),
              "app": (build / "firmware.bin", 0x10000),
          }
          missing = [name for name, (file, _) in required.items() if not file.is_file()]
          if missing:
              raise SystemExit("V29 flash bundle missing: " + ", ".join(missing))
          out = pathlib.Path("v29-release")
          out.mkdir(exist_ok=True)
          files = []
          for name, (source, offset) in required.items():
              dest = out / ("MeshOffGridNL-V29-" + name + ".bin")
              shutil.copyfile(source, dest)
              data = dest.read_bytes()
              if offset + len(data) > 16 * 1024 * 1024:
                  raise SystemExit("V29 flash segment exceeds 16MB")
              files.append({"role":name,"file":dest.name,"offset":offset,"size":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          for left, right in zip(sorted(files,key=lambda x:x["offset"]),sorted(files,key=lambda x:x["offset"])[1:]):
              if left["offset"] + left["size"] > right["offset"]:
                  raise SystemExit("V29 flash segments overlap")
          (out / "flash-layout.json").write_text(json.dumps({"board":"lilygo-t-deck-plus","flashSizeBytes":16777216,"sourceCommit":os.environ.get("GITHUB_SHA",""),"files":files},indent=2)+"\n")
          PY
          python - <<'PY'
          import hashlib, json, os
          path = "upstream-wadamesh/.pio/build/LilyGo_TDeck_companion_radio_touch/firmware.bin"
          data = open(path, "rb").read()
          manifest = {
              "schema": 1,
              "version": "29.0.0-dev",
              "channel": "candidate",
              "board": "lilygo-t-deck-plus",
              "chip": "ESP32-S3",
              "flashSizeBytes": 16777216,
              "file": "MeshOffGridNL-V29-PRO-TDeck-Plus.bin",
              "size": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "sourceCommit": os.environ.get("GITHUB_SHA", "")
          }
          os.makedirs("v29-release", exist_ok=True)
          open("v29-release/MeshOffGridNL-V29-PRO-TDeck-Plus.bin", "wb").write(data)
          open("v29-release/manifest.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Verify V29 flash bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          python v29/tests/test_flash_bundle.py v29-release

      - name: Upload V29 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshOffGridNL-V29-PRO-TDeck-Plus
          path: v29-release/
          if-no-files-found: error
          retention-days: 90
