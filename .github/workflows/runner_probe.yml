name: Runner Probe

on:
  push:
    branches:
      - runner-probe
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: runner-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Prove cleanup runner assignment
        shell: bash
        run: |
          set -euo pipefail
          echo "cleanup runner started"
          uname -a
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"

      - name: Cancel superseded XR run 200
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 35374653728; do
            echo "Cancelling known stale XR run $run_id"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
          done
