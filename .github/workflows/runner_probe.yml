name: Runner Probe

on:
  push:
    branches:
      - runner-probe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Prove GitHub-hosted runner assignment
        shell: pwsh
        run: |
          Write-Output "runner probe started"
          Write-Output "RUNNER_OS=$env:RUNNER_OS"
          Write-Output "RUNNER_ARCH=$env:RUNNER_ARCH"
