name: Runner Probe

on:
  push:
    branches:
      - runner-probe
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: runner-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Cleanup disabled
        shell: bash
        run: |
          set -euo pipefail
          echo "No XR runs will be cancelled by this probe."
