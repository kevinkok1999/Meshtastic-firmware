name: V14 Targeted Gate

on:
  push:
    branches:
      - v14-development
      - v14-phase2
    paths:
      - "src/mesh/MeshOffGrid*.h"
      - "src/mesh/MeshOffGrid*.cpp"
      - "test/test_meshoffgrid_*/**"
      - ".github/workflows/v14_targeted_gate.yml"

concurrency:
  group: v14-targeted-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v14-gate:
    name: V14 native tests and T-Deck build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup native build
        uses: ./.github/actions/setup-native

      - name: Pin compatible PlatformIO/SCons toolchain
        run: |
          python -m pip install --force-reinstall "platformio==6.1.19"
          rm -rf "$HOME/.platformio/packages/tool-scons"
          pio pkg install -g -t "platformio/tool-scons@4.40801.0" --force
          pio --version
          pio pkg list -g --only-tools | grep -A2 -B1 "tool-scons" || true

      - name: Route Brain native tests
        run: pio test -e native -f test_meshoffgrid_route_brain

      - name: Delivery Core native tests
        run: pio test -e native -f test_meshoffgrid_delivery_core

      - name: DirectLink codec native tests
        run: pio test -e native -f test_meshoffgrid_direct_codec

      - name: Compile T-Deck firmware
        run: pio run -e t-deck

      - name: Record firmware outputs
        if: success()
        run: |
          find .pio/build/t-deck -maxdepth 1 -type f \( -name "*.bin" -o -name "*.elf" -o -name "*.mt.json" \) -print -exec ls -lh {} \;
          find .pio/build/t-deck -maxdepth 1 -type f -name "*.bin" -print0 | xargs -0 -r sha256sum

      - name: Upload validated V14 T-Deck artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MeshOffGridNL-V14-TDeck-${{ github.sha }}
          if-no-files-found: error
          path: |
            .pio/build/t-deck/*.bin
            .pio/build/t-deck/*.elf
            .pio/build/t-deck/*.mt.json
