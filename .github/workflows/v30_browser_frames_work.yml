name: V30 browser framing work
on:
  push:
    branches: [v30-work-browser-frames]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: c++ -std=c++17 -Wall -Wextra -Werror v30/tests/browser_frames/test_term.cpp -o /tmp/v30-term
      - run: /tmp/v30-term
