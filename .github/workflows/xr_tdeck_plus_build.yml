name: XR T-Deck Plus Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tdeck-plus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLATFORMIO_DISABLE_UPGRADE_CHECK: "1"
    steps:
      - name: Checkout XR branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'platformio==6.2.0'
          pio --version

      - name: Install target packages and apply pioarduino SCons compatibility fix
        run: |
          pio pkg install -e t-deck-tft
          python - <<'PY'
          from pathlib import Path

          platform_py = Path.home() / ".platformio" / "platforms" / "espressif32" / "platform.py"
          if not platform_py.exists():
              raise SystemExit(f"pioarduino platform.py not found: {platform_py}")

          text = platform_py.read_text(encoding="utf-8")
          before = text
          text = text.replace('    "tool-scons",\n', '')
          if text == before:
              raise SystemExit("Expected tool-scons entry was not found in COMMON_IDF_PACKAGES")
          platform_py.write_text(text, encoding="utf-8")
          print(f"Patched {platform_py}: PlatformIO Core now owns tool-scons")
          PY

      - name: Build T-Deck Plus device UI target
        run: pio run -e t-deck-tft

      - name: Show firmware sizes
        run: |
          ls -lh .pio/build/t-deck-tft/
          test -f .pio/build/t-deck-tft/firmware.bin

      - name: Package flash files
        run: |
          mkdir -p xr-release
          cp .pio/build/t-deck-tft/firmware.bin xr-release/XR-TDeck-Plus-firmware.bin
          cp .pio/build/t-deck-tft/partitions.bin xr-release/partitions.bin || true
          cp .pio/build/t-deck-tft/bootloader.bin xr-release/bootloader.bin || true
          cp .pio/build/t-deck-tft/littlefs.bin xr-release/littlefs.bin || true
          sha256sum xr-release/* > xr-release/SHA256SUMS.txt

      - name: Upload XR T-Deck Plus artifact
        uses: actions/upload-artifact@v7
        with:
          name: XR-TDeck-Plus-${{ github.event.pull_request.head.sha || github.sha }}
          path: xr-release/
          retention-days: 30
