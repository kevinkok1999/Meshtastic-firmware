name: XR T-Deck Plus Build

on:
  push:
    branches:
      - xr/hybrid-delivery-autopilot
  workflow_dispatch:

permissions:
  contents: read

# Only the newest XR revision matters. Rapid firmware iteration used to leave
# obsolete T-Deck builds queued ahead of the current commit.
concurrency:
  group: xr-tdeck-plus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tdeck-plus:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PLATFORMIO_DISABLE_UPGRADE_CHECK: "1"
    steps:
      - name: Checkout XR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'platformio==6.2.0'
          pio --version

      - name: Install target packages and apply pioarduino SCons compatibility fix
        run: |
          pio pkg install -e t-deck-tft
          python - <<'PY'
          from pathlib import Path

          platform_py = Path.home() / ".platformio" / "platforms" / "espressif32" / "platform.py"
          if not platform_py.exists():
              raise SystemExit(f"pioarduino platform.py not found: {platform_py}")

          text = platform_py.read_text(encoding="utf-8")
          before = text
          text = text.replace('    "tool-scons",\n', '')
          if text == before:
              raise SystemExit("Expected tool-scons entry was not found in COMMON_IDF_PACKAGES")
          platform_py.write_text(text, encoding="utf-8")
          print(f"Patched {platform_py}: PlatformIO Core now owns tool-scons")
          PY

      - name: Build T-Deck Plus device UI target
        shell: bash
        run: |
          set -o pipefail
          pio run -e t-deck-tft 2>&1 | tee /tmp/xr-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Compiler diagnostics"
            grep -E '(^|: )(fatal error:|error:|undefined reference|collect2: error|*** \[)' /tmp/xr-build.log | tail -n 80 || true
            echo "::endgroup::"
            first=$(grep -E -m1 'fatal error:|error:|undefined reference|collect2: error' /tmp/xr-build.log || true)
            if [ -n "$first" ]; then
              first=${first//'%'/'%25'}
              first=${first//$'\r'/'%0D'}
              first=${first//$'\n'/'%0A'}
              echo "::error title=XR T-Deck compile failed::$first"
            fi
            exit "$status"
          fi

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: XR-TDeck-Plus-compiler-log-${{ github.sha }}
          path: /tmp/xr-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Locate and validate flashable firmware
        id: firmware
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=.pio/build/t-deck-tft
          echo "Build directory contents:"
          find "$BUILD_DIR" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

          mapfile -t candidates < <(find "$BUILD_DIR" -maxdepth 2 -type f \( -name 'firmware*.bin' -o -name '*firmware*.bin' -o -name 'program.bin' \) -size +0c | sort)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No non-empty firmware binary found under $BUILD_DIR" >&2
            exit 1
          fi

          preferred="$BUILD_DIR/firmware.bin"
          if [ -s "$preferred" ]; then
            firmware="$preferred"
          else
            firmware="${candidates[0]}"
          fi
          echo "Using firmware binary: $firmware"
          ls -lh "$firmware"
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"

      - name: Package flash files
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=.pio/build/t-deck-tft
          mkdir -p xr-release
          cp "${{ steps.firmware.outputs.firmware }}" xr-release/XR-TDeck-Plus-firmware.bin

          factory=$(find "$BUILD_DIR" -maxdepth 1 -type f -name '*factory.bin' -size +0c | head -n1 || true)
          littlefs=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'littlefs*.bin' -size +0c | head -n1 || true)
          metadata=$(find "$BUILD_DIR" -maxdepth 1 -type f -name '*.mt.json' -size +0c | head -n1 || true)
          bootapp=$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -type f -name 'boot_app0.bin' -size +0c | head -n1 || true)

          test -n "$factory" && test -s "$factory" || { echo "Factory image missing" >&2; exit 1; }
          test -n "$littlefs" && test -s "$littlefs" || { echo "LittleFS image missing" >&2; exit 1; }

          cp "$factory" xr-release/XR-TDeck-Plus-factory.bin
          cp "$littlefs" xr-release/XR-TDeck-Plus-littlefs.bin
          [ -z "$metadata" ] || cp "$metadata" xr-release/XR-TDeck-Plus.mt.json
          [ -z "$bootapp" ] || cp "$bootapp" xr-release/boot_app0.bin

          for file in partitions.bin bootloader.bin; do
            if [ -s "$BUILD_DIR/$file" ]; then
              cp "$BUILD_DIR/$file" "xr-release/$file"
            fi
          done

          cat > xr-release/FLASHING.txt <<'EOF'
          XR T-Deck Plus — first-test flash package

          Full first installation (ESP32-S3, 16 MB layout):
          1. Optional clean start (ERASES settings): esptool.py --chip esp32s3 erase_flash
          2. Flash the merged application image:
             esptool.py --chip esp32s3 write_flash 0x000000 XR-TDeck-Plus-factory.bin
          3. Flash the filesystem image:
             esptool.py --chip esp32s3 write_flash 0xC90000 XR-TDeck-Plus-littlefs.bin

          Firmware-only update on a device already using this 16 MB partition layout:
             esptool.py --chip esp32s3 write_flash 0x010000 XR-TDeck-Plus-firmware.bin

          XBee XR868 profile in this build:
          - UART2
          - T-Deck GPIO48 (TX) -> XBee DIN/RX
          - T-Deck GPIO47 (RX) <- XBee DOUT/TX
          - Common GND
          - Bare XR 868 UART I/O is 3.3 V-class; use an appropriate regulated supply/carrier.
          - Firmware first probes AP=1 at 115200 baud.
          - A factory-default XR 868 (AP=0, 9600 baud) is automatically provisioned once detected:
            AP=1, AO=0, BD=7 (115200), then saved with WR.
          - If no XBee answers either path, LoRa/ESP-NOW continue without XBee.
          - A previously customized XBee with non-default baud/guard/command settings should be reset to factory defaults or
            configured in XCTU for AP=1, AO=0, 115200 baud.
          EOF

          find xr-release -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          sha256sum xr-release/*.bin > xr-release/SHA256SUMS.txt
          cat xr-release/SHA256SUMS.txt

      - name: Upload XR T-Deck Plus artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: XR-TDeck-Plus-${{ github.sha }}
          path: xr-release/
          if-no-files-found: error
          retention-days: 30
