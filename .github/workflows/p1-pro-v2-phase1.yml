name: P1 Pro V2 Phase 1 EU868 Adaptive

on:
  push:
    branches: [p1-pro-v2-phase1-eu868-adaptive]
    paths:
      - "p1pro-v2/**"
      - ".github/workflows/p1-pro-v2-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meshoffgridnl-firmware-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Fetch pinned MeshCore
        run: |
          git clone https://github.com/meshcore-dev/MeshCore.git upstream-meshcore
          cd upstream-meshcore
          git checkout e94125987ed87497e706a0b54d1e80c709343980
          test "$(git rev-parse HEAD)" = "e94125987ed87497e706a0b54d1e80c709343980"

      - name: Apply proven V1 base and resilience
        run: |
          python p1pro-v1/apply_p1pro_v1.py upstream-meshcore
          python p1pro-v1/tests/test_contracts.py upstream-meshcore
          python p1pro-v1/apply_phase2.py upstream-meshcore
          python p1pro-v1/tests/test_phase2.py upstream-meshcore

      - name: Apply V2 EU868 adaptive layer
        run: |
          python p1pro-v2/apply_phase1.py upstream-meshcore
          python p1pro-v2/tests/test_phase1.py upstream-meshcore

      - name: Install pinned PlatformIO
        run: python -m pip install "platformio==6.2.0"

      - name: Build SenseCAP Solar only
        run: |
          cd upstream-meshcore
          pio run -e SenseCap_Solar_repeater

      - name: Package Phase 1 candidate
        run: |
          mkdir -p dist
          python upstream-meshcore/bin/uf2conv/uf2conv.py             upstream-meshcore/.pio/build/SenseCap_Solar_repeater/firmware.hex             -c -o dist/MeshOffGridNL-P1-Pro-V2-PHASE1.uf2 -f 0xADA52840
          sha256sum dist/* > dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: MeshOffGridNL-P1-Pro-V2-Phase1
          path: dist/*
          retention-days: 14
