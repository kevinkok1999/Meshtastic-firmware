name: V21 Golden Wi-Fi A-B

on:
  push:
    branches:
      - v21-wifi-first
    paths:
      - "v21/golden/**"
      - ".github/workflows/v21-golden-wifi.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meshoffgridnl-firmware-build
  cancel-in-progress: true

jobs:
  golden-wifi:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: v21-golden-pio-${{ runner.os }}-${{ hashFiles('v21/golden/platformio.ini','v21/golden/boards/t-deck.json') }}

      - name: Build Golden A — legacy stack
        run: |
          pio run -d v21/golden -e golden-old
          mkdir -p dist/old
          BUILD=v21/golden/.pio/build/golden-old
          BOOT_APP0="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"
          test -n "$BOOT_APP0"
          test -f "$BOOT_APP0"
          cp "$BUILD/bootloader.bin" dist/old/MeshOffGridNL-V21-Golden-A-bootloader.bin
          cp "$BUILD/partitions.bin" dist/old/MeshOffGridNL-V21-Golden-A-partitions.bin
          cp "$BOOT_APP0" dist/old/MeshOffGridNL-V21-Golden-A-boot_app0.bin
          cp "$BUILD/firmware.bin" dist/old/MeshOffGridNL-V21-Golden-A-legacy.bin
          pio pkg list -d v21/golden -e golden-old > dist/old/MeshOffGridNL-V21-Golden-A-packages.txt

      - name: Build Golden B — modern stack
        run: |
          pio run -d v21/golden -e golden-modern
          mkdir -p dist/modern
          BUILD=v21/golden/.pio/build/golden-modern
          BOOT_APP0="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"
          test -n "$BOOT_APP0"
          test -f "$BOOT_APP0"
          cp "$BUILD/bootloader.bin" dist/modern/MeshOffGridNL-V21-Golden-B-bootloader.bin
          cp "$BUILD/partitions.bin" dist/modern/MeshOffGridNL-V21-Golden-B-partitions.bin
          cp "$BOOT_APP0" dist/modern/MeshOffGridNL-V21-Golden-B-boot_app0.bin
          cp "$BUILD/firmware.bin" dist/modern/MeshOffGridNL-V21-Golden-B-modern.bin
          if test -f "$BUILD/firmware.factory.bin"; then
            cp "$BUILD/firmware.factory.bin" dist/modern/MeshOffGridNL-V21-Golden-B-factory.bin
          fi
          pio pkg list -d v21/golden -e golden-modern > dist/modern/MeshOffGridNL-V21-Golden-B-packages.txt

      - name: Build manifests and hashes
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("dist")
          for name,folder in (("A-legacy","old"),("B-modern","modern")):
              d=root/folder
              app_name = "MeshOffGridNL-V21-Golden-A-legacy.bin" if folder == "old" else "MeshOffGridNL-V21-Golden-B-modern.bin"
              app=d/app_name
              if not app.exists():
                  raise SystemExit(f"missing expected app binary: {app}")
              manifest={
                  "schema":1,
                  "name":"MeshOffGridNL V21 Golden Wi-Fi "+name,
                  "board":"LILYGO T-Deck / T-Deck Plus",
                  "testSsid":"MeshOffGrid21",
                  "testPassword":"MeshOffGrid21Test",
                  "bleStarted":False,
                  "loraIncluded":False,
                  "scanIncluded":False,
                  "customSecurityOverrides":False,
                  "normalPath":"events -> WIFI_STA once -> WiFi.begin -> CONNECTED -> GOT_IP",
                  "app":{"file":app.name,"size":app.stat().st_size}
              }
              for p in d.glob("*.bin"):
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  manifest.setdefault("sha256",{})[p.name]=h
              manifest_name = "MeshOffGridNL-V21-Golden-A-manifest.json" if folder == "old" else "MeshOffGridNL-V21-Golden-B-manifest.json"
              (d/manifest_name).write_text(json.dumps(manifest,indent=2)+"\n")
          PY
          find dist -maxdepth 2 -type f -print -exec sha256sum {} \;

      - name: Publish diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mesh-v21-golden-wifi-rc1
        run: |
          NOTES="V21 Phase 1 diagnostic only. Two minimal T-Deck Wi-Fi-only builds use identical application logic: Golden A on legacy PlatformIO/Arduino stack, Golden B on pioarduino modern stable. BLE, LoRa, WadaMesh, scanning and custom Wi-Fi security/recovery logic are absent. Temporarily set the Samsung S21 hotspot to SSID MeshOffGrid21, password MeshOffGrid21Test, 2.4 GHz and WPA2 if selectable. This is not the full V21 firmware."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/old/* dist/modern/* --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "MeshOffGridNL V21 Golden Wi-Fi RC1" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" dist/old/* dist/modern/* --target "$GITHUB_SHA" --title "MeshOffGridNL V21 Golden Wi-Fi RC1" --notes "$NOTES" --prerelease
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeshOffGridNL-V21-Golden-WiFi
          path: dist/**
          retention-days: 30
