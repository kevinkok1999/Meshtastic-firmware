name: V30 release-work verifier
on:
  push:
    branches: [v30-work-release]
    paths: ["v30/installer/**", "v30/tests/**", ".github/workflows/v30_release_work.yml"]
  pull_request:
    branches: [v30-work-release]
    paths: ["v30/installer/**", "v30/tests/**", ".github/workflows/v30_release_work.yml"]
permissions:
  contents: read
jobs:
  offline-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Run offline verifier tests
        run: python -m unittest discover -s v30/tests -p "test_verify_install_manifest.py" -v

# Verifier remains development-only; no production release or hardware flashing.
