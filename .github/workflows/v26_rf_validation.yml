name: V26 RF Validation

on:
  push:
    branches:
      - v26-rf-intelligence
  workflow_dispatch:

concurrency:
  group: v26-rf-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: V26 RF host test + T-Deck build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Host-test V26 RF intelligence logic
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rf_intelligence_test.cpp <<'CPP'
          #include "mesh/RFIntelligence.h"
          #include <cassert>
          using namespace meshoffgrid;

          int main() {
              RFIntelligenceSnapshot empty;
              assert(chooseRxGain(empty, false) == RxGainDecision::KEEP);

              RFIntelligenceSnapshot clean;
              clean.hasNoiseFloor = true;
              clean.noiseFloorDbm = -116;
              clean.hasPacketMetrics = true;
              clean.packetRssiDbm = -111.0f;
              clean.packetSnrDb = 0.5f;
              clean.hasCadMetrics = true;
              clean.cadBusyPermille = 180;
              clean.hasErrorMetrics = true;
              clean.packetErrorPermille = 80;
              assert(chooseRxGain(clean, false) == RxGainDecision::BOOSTED);

              RFIntelligenceSnapshot noisy = clean;
              noisy.noiseFloorDbm = -99;
              assert(chooseRxGain(noisy, true) == RxGainDecision::POWER_SAVE);

              RFIntelligenceSnapshot blocker = clean;
              blocker.noiseFloorDbm = -106;
              blocker.cadBusyPermille = 850;
              assert(chooseRxGain(blocker, true) == RxGainDecision::POWER_SAVE);

              RFIntelligenceSnapshot hysteresis = clean;
              hysteresis.noiseFloorDbm = -109;
              hysteresis.packetRssiDbm = -104.0f;
              hysteresis.packetSnrDb = 4.0f;
              hysteresis.cadBusyPermille = 400;
              hysteresis.packetErrorPermille = 100;
              assert(chooseRxGain(hysteresis, true) == RxGainDecision::KEEP);

              RFIntelligenceSnapshot errors = clean;
              errors.noiseFloorDbm = -114;
              errors.packetErrorPermille = 600;
              assert(chooseRxGain(errors, true) == RxGainDecision::POWER_SAVE);

              assert(rfQualityScore(clean) > rfQualityScore(noisy));
              return 0;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc /tmp/rf_intelligence_test.cpp -o /tmp/rf_intelligence_test
          /tmp/rf_intelligence_test

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U --no-build-isolation --no-cache-dir "setuptools<72"
          pip install -U platformio --no-build-isolation

      - name: Compile T-Deck TFT firmware
        run: platformio run -e t-deck-tft
