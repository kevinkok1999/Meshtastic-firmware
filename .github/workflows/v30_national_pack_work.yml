name: V30 national map candidate
on:
  push:
    branches: [v30-national-captured-261116]
    paths: [".github/workflows/v30_national_pack_work.yml"]
permissions:
  contents: read
  actions: read
jobs:
  unit-and-pbf-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install native extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install osmium==4.3.2 shapely==2.1.2
      - name: Run actual binary PBF and map selection checks
        run: |
          python -c 'import osmium, shapely'
          command -v osmium
          python -m unittest discover -s v30/tests -p test_national_pack.py -v
          python -m unittest discover -s v30/tests -p test_map_build.py -v
          python -m unittest discover -s v30/tests -p test_osm_ingest.py -v
  national-candidate:
    # One verified candidate run on this isolated branch only. Never publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/v30-national-captured-261116' && github.run_attempt == '1'
    needs: [unit-and-pbf-smoke]
    timeout-minutes: 50
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE: "261116"
      EXPECTED_PBF: "2d0528596573987ae547ba4dc16b50c347ac97cfc3fc864d470f184dc8e5c1c7"
      EXPECTED_BOUNDARY: "845bbe3287d77ee4bb16b75374cc55a5f6464ab4e95d1a634636de18e2aa9400"
      EXPECTED_BOUNDARY_METADATA: "ac516a3e7bb1168c93dbf4f77c5373d50b12b69b3f90ddb11489ed8153f38a2a"
      EXPECTED_BOUNDARY_CANONICAL: "25acd7dfde99919493f23bfef57c8db2373e3b2a83dfaf89e0ea1838c19b4c0b"
      EXPECTED_BOUNDARY_EVIDENCE: "e22b88245f1f143926bb667218cbc74d91ebf435ada62373b4847bc2320978af"
      BOOTSTRAP: "false"
      BOUNDARY_URL: https://api.pdok.nl/kadaster/brk-bestuurlijke-gebieden/ogc/v1/collections/provinciegebied/items?f=json&limit=100
      BOUNDARY_METADATA_URL: https://api.pdok.nl/kadaster/brk-bestuurlijke-gebieden/ogc/v1/collections/provinciegebied?f=json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install osmium==4.3.2 shapely==2.1.2
      - name: Retrieve pinned artifact from separate successful boundary capture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: "14430552513"
          path: map-output/
          github-token: ${{ github.token }}
          repository: kevinkok1999/Meshtastic-firmware
          run-id: "44311825192"
      - name: Verify frozen boundary and acquire dated PBF bytes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_DATE" =~ ^[0-9]{6}$ ]]
          [[ "$EXPECTED_PBF" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BOUNDARY" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p map-input map-output
          printf '%s  %s\n' "$EXPECTED_BOUNDARY" map-output/pdok-provinces.geojson | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_BOUNDARY_METADATA" map-output/pdok-collection.json | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_BOUNDARY_EVIDENCE" map-output/boundary-evidence.json | sha256sum -c -
          cp map-output/pdok-provinces.geojson map-input/provinces.geojson
          PYTHONPATH=v30/maps python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from national_pack import ProvinceLocator
          data = Path("map-input/provinces.geojson").read_bytes()
          evidence = json.loads(Path("map-output/boundary-evidence.json").read_bytes())
          assert evidence["production"] is False
          assert evidence["source_url"] == os.environ["BOUNDARY_URL"]
          assert evidence["metadata_url"] == os.environ["BOUNDARY_METADATA_URL"]
          assert evidence["commit"] == "6b38fb757db43030f388ea58a56689b9c952f282"
          assert evidence["run_id"] == "44311825192"
          assert evidence["raw_geojson_sha256"] == os.environ["EXPECTED_BOUNDARY"]
          assert evidence["raw_metadata_sha256"] == os.environ["EXPECTED_BOUNDARY_METADATA"]
          locator = ProvinceLocator(json.loads(data), require_fast=True)
          canonical = json.dumps(locator.polygons, sort_keys=True, ensure_ascii=False,
                                 separators=(",",":"), allow_nan=False).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == evidence["canonical_geometry_sha256"] == os.environ["EXPECTED_BOUNDARY_CANONICAL"]
          print("Verified 12 frozen province geometries:", ", ".join(sorted(locator.polygons)))
          PY
          PBF_URL="https://download.geofabrik.de/europe/netherlands-${SOURCE_DATE}.osm.pbf"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 1024 "$PBF_URL.md5" --output map-output/geofabrik-source.md5
          OFFICIAL_MD5="$(awk 'NR==1 {print $1}' map-output/geofabrik-source.md5)"
          [[ "$OFFICIAL_MD5" =~ ^[0-9a-f]{32}$ ]]
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 0 --max-time 1200 --max-filesize 2147483648 "$PBF_URL" --output map-input/source.osm.pbf
          printf '%s  %s\n' "$OFFICIAL_MD5" map-input/source.osm.pbf | md5sum -c -
          printf '%s  %s\n' "$EXPECTED_PBF" map-input/source.osm.pbf | sha256sum -c -
          DATA_TIMESTAMP="$(osmium fileinfo -g header.option.osmosis_replication_timestamp map-input/source.osm.pbf)"
          [[ "$DATA_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          echo "PBF_URL=$PBF_URL" >> "$GITHUB_ENV"
          echo "DATA_TIMESTAMP=$DATA_TIMESTAMP" >> "$GITHUB_ENV"
          echo "EXPECTED_PBF=$EXPECTED_PBF" >> "$GITHUB_ENV"
          echo "EXPECTED_BOUNDARY=$EXPECTED_BOUNDARY" >> "$GITHUB_ENV"
          echo "OFFICIAL_MD5=$OFFICIAL_MD5" >> "$GITHUB_ENV"
      - name: Filter to supported roads, waterways and settlements with references
        run: |
          osmium tags-filter --no-progress map-input/source.osm.pbf \
            'n/place=city,town,village,hamlet,suburb' \
            'w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,residential,unclassified,living_street' \
            'w/waterway=river,canal,stream' 'w/natural=water' \
            -o map-input/filtered.osm.pbf
      - name: Produce non-production map and measure the actual decoded inventory
        run: |
          FILTERED_HASH="$(sha256sum map-input/filtered.osm.pbf | cut -d' ' -f1)"
          python v30/maps/national_pack.py map-input/filtered.osm.pbf map-input/provinces.geojson map-output \
            --data-date "$DATA_TIMESTAMP" --pbf-sha256 "$FILTERED_HASH" --boundaries-sha256 "$EXPECTED_BOUNDARY"
          python v30/maps/national_provenance.py map-output/coverage.json map-output/provenance.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("map-output/provenance.json")
          p = json.loads(path.read_text())
          p["boundary_capture"] = {"run_id":"44311825192","artifact_id":"14430552513",
                                   "evidence_sha256":"e22b88245f1f143926bb667218cbc74d91ebf435ada62373b4847bc2320978af",
                                   "canonical_geometry_sha256":"25acd7dfde99919493f23bfef57c8db2373e3b2a83dfaf89e0ea1838c19b4c0b",
                                   "metadata_sha256":"ac516a3e7bb1168c93dbf4f77c5373d50b12b69b3f90ddb11489ed8153f38a2a"}
          path.write_text(json.dumps(p, sort_keys=True, indent=2) + "\n")
          PY
      - name: Retain an unsigned candidate and evidence, never publish a firmware release
        uses: actions/upload-artifact@v4
        with:
          name: V30-unsigned-NL-map-candidate
          path: map-output/
          if-no-files-found: error
          retention-days: 7
