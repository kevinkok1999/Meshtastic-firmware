name: V11 WadaMesh Global

on:
  push:
    branches:
      - v11-wadamesh
    paths:
      - "v11/**"
      - ".github/workflows/v11-wadamesh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v11-wadamesh-firmware
  cancel-in-progress: true

jobs:
  build-v11:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout firmware workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            upstream-wadamesh/.pio
          key: v11-pio-${{ runner.os }}-${{ hashFiles('v11/**') }}

      - name: Fetch pinned WadaMesh beta_83
        run: |
          git clone --depth 1 --branch beta_83 https://github.com/ALLFATHER-BV/wadamesh.git upstream-wadamesh
          cd upstream-wadamesh
          test "$(git rev-parse HEAD)" = "6fe6b9f06332708b6ed0cc78958017d0dcc9e35d"

      - name: Apply V11 overlay and run fast contracts
        run: |
          python v11/apply_v11.py upstream-wadamesh
          python v11/tests/test_contracts.py upstream-wadamesh

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build only T-Deck / T-Deck Plus
        env:
          PLATFORMIO_BUILD_FLAGS: >-
            -DFIRMWARE_RELEASE_TAG='"mog-v11.0.0-rc1"'
            -DFIRMWARE_VERSION='"MeshOffGridNL V11 Global"'
        run: |
          cd upstream-wadamesh
          pio run -e LilyGo_TDeck_companion_radio_touch -t mergebin

      - name: Package firmware, source and manifest
        run: |
          mkdir -p dist
          cp upstream-wadamesh/.pio/build/LilyGo_TDeck_companion_radio_touch/firmware.bin              dist/MeshOffGridNL-V11-TDeck-Plus.bin
          cp upstream-wadamesh/.pio/build/LilyGo_TDeck_companion_radio_touch/firmware-merged.bin              dist/MeshOffGridNL-V11-TDeck-Plus-merged.bin
          cp upstream-wadamesh/LICENSE dist/WADAMESH-GPL-3.0-LICENSE.txt

          tar             --exclude='upstream-wadamesh/.git'             --exclude='upstream-wadamesh/.pio'             -czf dist/MeshOffGridNL-V11-corresponding-source.tar.gz             upstream-wadamesh

          python - <<'PY'
          import hashlib
          import json
          import pathlib

          d = pathlib.Path("dist")
          app = d / "MeshOffGridNL-V11-TDeck-Plus.bin"
          merged = d / "MeshOffGridNL-V11-TDeck-Plus-merged.bin"

          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          manifest = {
              "schema": 1,
              "version": "11.0.0-rc1",
              "label": "MeshOffGridNL V11 WadaMesh Global",
              "board": "lilygo-t-deck-plus",
              "chip": "ESP32-S3",
              "flashSizeBytes": 16777216,
              "upstream": {
                  "repo": "ALLFATHER-BV/wadamesh",
                  "tag": "beta_83",
                  "commit": "6fe6b9f06332708b6ed0cc78958017d0dcc9e35d"
              },
              "radio": {
                  "frequencyMHz": 869.618,
                  "bandwidthKHz": 62.5,
                  "spreadingFactor": 8,
                  "txPowerDbm": 22,
                  "maxTxPowerDbm": 22,
                  "dio2RfSwitch": True,
                  "rxBoostedGain": True
              },
              "globalTransport": {
                  "kind": "mqtt-e2ee-dm",
                  "defaultBroker": "broker.emqx.io",
                  "port": 1883,
                  "payloadEncryption": "AES-256-GCM",
                  "peerKeyAgreement": "MeshCore identity ECDH",
                  "status": "rc1"
              },
              "app": {
                  "file": app.name,
                  "size": app.stat().st_size,
                  "sha256": sha(app)
              },
              "merged": {
                  "file": merged.name,
                  "size": merged.stat().st_size,
                  "sha256": sha(merged)
              }
          }

          (d / "v11-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

          sha256sum dist/*

      - name: Publish rolling V11 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mesh-v11.0.0-rc1
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/*               --prerelease               --target "$GITHUB_SHA"               --title "MeshOffGridNL V11 WadaMesh Global RC1"               --notes "Pinned WadaMesh beta_83 plus MeshOffGridNL V11. T-Deck/T-Deck Plus only. Normal MeshCore LoRa remains active; V11 peers additionally mirror direct chats worldwide over Wi-Fi using application-layer AES-256-GCM derived from the existing MeshCore ECDH identity. Corresponding source and GPL license are attached."
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshOffGridNL-V11-TDeck-Plus
          path: dist/*
          retention-days: 30
