name: P1 Pro V1 RC1 Release

on:
  push:
    branches:
      - p1-pro-v1-phase3-release
    paths:
      - "p1pro-v1/**"
      - ".github/workflows/p1-pro-v1-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meshoffgridnl-firmware-build
  cancel-in-progress: false

env:
  MESHCORE_COMMIT: e94125987ed87497e706a0b54d1e80c709343980
  TARGET: SenseCap_Solar_repeater
  RELEASE_TAG: p1pro-v1.0.0-rc1
  RELEASE_NAME: MeshOffGridNL P1 Pro V1 RC1

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout MeshOffGridNL firmware workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned MeshCore
        run: |
          rm -rf upstream-meshcore
          git clone https://github.com/meshcore-dev/MeshCore.git upstream-meshcore
          cd upstream-meshcore
          git checkout "$MESHCORE_COMMIT"
          test "$(git rev-parse HEAD)" = "$MESHCORE_COMMIT"

      - name: Apply and test Phase 1
        run: |
          python p1pro-v1/apply_p1pro_v1.py upstream-meshcore
          python p1pro-v1/tests/test_contracts.py upstream-meshcore

      - name: Apply and test Phase 2
        run: |
          python p1pro-v1/apply_phase2.py upstream-meshcore
          python p1pro-v1/tests/test_phase2.py upstream-meshcore

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build official nRF52 output set
        env:
          FIRMWARE_VERSION: p1pro-v1.0.0-rc1
          DISABLE_DEBUG: "1"
        run: |
          cd upstream-meshcore
          bash build.sh build-firmware "$TARGET"
          ls -lah out/
          test -n "$(find out -maxdepth 1 -name '*.uf2' -print -quit)"
          test -n "$(find out -maxdepth 1 -name '*.zip' -print -quit)"

      - name: Package RC1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          UF2="$(find upstream-meshcore/out -maxdepth 1 -name 'SenseCap_Solar_repeater-*.uf2' -print -quit)"
          DFU="$(find upstream-meshcore/out -maxdepth 1 -name 'SenseCap_Solar_repeater-*.zip' -print -quit)"
          test -f "$UF2"
          test -f "$DFU"

          cp "$UF2" dist/MeshOffGridNL-P1-Pro-V1-RC1.uf2
          cp "$DFU" dist/MeshOffGridNL-P1-Pro-V1-RC1.zip

          curl --fail --location --retry 3             "https://flasher.meshcore.io/firmware/FLASH_ERASE_nrf52_softdevice_v7.zip"             -o dist/FLASH_ERASE_nrf52_softdevice_v7.zip
          unzip -t dist/FLASH_ERASE_nrf52_softdevice_v7.zip

          tar             --exclude='.git'             --exclude='.pio'             --exclude='out'             -czf dist/MeshOffGridNL-P1-Pro-V1-RC1-source.tar.gz             upstream-meshcore p1pro-v1

          python - <<'PY'
          import hashlib, json, os, pathlib
          d = pathlib.Path("dist")

          files = [
              d / "MeshOffGridNL-P1-Pro-V1-RC1.zip",
              d / "MeshOffGridNL-P1-Pro-V1-RC1.uf2",
              d / "FLASH_ERASE_nrf52_softdevice_v7.zip",
              d / "MeshOffGridNL-P1-Pro-V1-RC1-source.tar.gz",
          ]

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          manifest = {
              "schema": 1,
              "product": "MeshOffGridNL P1 Pro V1",
              "release": "RC1",
              "stable": False,
              "board": "seeed-sensecap-solar-node-p1",
              "compatibleHardware": [
                  "Seeed Studio SenseCAP Solar Node P1",
                  "Seeed Studio SenseCAP Solar Node P1 Pro"
              ],
              "target": os.environ["TARGET"],
              "mcu": "nRF52840",
              "radio": "SX1262",
              "radioProfile": {
                  "frequencyMHz": 869.618,
                  "bandwidthKHz": 62.5,
                  "spreadingFactor": 8,
                  "codingRate": 5,
                  "txPowerDbm": 22
              },
              "protocol": "MeshCore",
              "role": "repeater-base-station",
              "meshcoreCommit": os.environ["MESHCORE_COMMIT"],
              "workspaceCommit": os.environ["GITHUB_SHA"],
              "routing": {
                  "scopedFloodMax": 48,
                  "unscopedFloodMax": 6,
                  "advertFloodMax": 8,
                  "pathHashBytes": 1
              },
              "resilience": {
                  "packetPool": 32,
                  "periodicAdvertSuppressionOnCongestion": True,
                  "stallRecoveryMs": 120000,
                  "safePrefsTransaction": True,
                  "powerSavingDefault": True,
                  "gpsForcedOn": False
              },
              "installer": {
                  "type": "nrf52-dfu",
                  "eraseRequiredForFactoryClean": True,
                  "eraseFile": "FLASH_ERASE_nrf52_softdevice_v7.zip",
                  "flashFile": "MeshOffGridNL-P1-Pro-V1-RC1.zip",
                  "uf2Fallback": "MeshOffGridNL-P1-Pro-V1-RC1.uf2",
                  "automaticBootloaderUpgrade": False
              },
              "artifacts": [
                  {
                      "file": p.name,
                      "size": p.stat().st_size,
                      "sha256": sha256(p)
                  }
                  for p in files
              ]
          }

          (d / "p1-pro-v1-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          print(json.dumps(manifest, indent=2))
          PY

          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Validate release contract
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          d = pathlib.Path("dist")
          m = json.loads((d / "p1-pro-v1-manifest.json").read_text())

          assert m["schema"] == 1
          assert m["stable"] is False
          assert m["target"] == "SenseCap_Solar_repeater"
          assert m["mcu"] == "nRF52840"
          assert m["radio"] == "SX1262"
          assert m["routing"] == {
              "scopedFloodMax": 48,
              "unscopedFloodMax": 6,
              "advertFloodMax": 8,
              "pathHashBytes": 1
          }

          for item in m["artifacts"]:
              p = d / item["file"]
              assert p.exists(), item["file"]
              assert p.stat().st_size == item["size"], item["file"]
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              assert digest == item["sha256"], item["file"]

          print("RC1 release contract OK")
          PY

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<'EOF'
          MeshOffGridNL P1 Pro V1 RC1

          Dedicated SenseCAP Solar / P1 Pro MeshCore base-station candidate.

          Highlights:
          - scoped flood ceiling 48 hops
          - unscoped ceiling 6 hops
          - advert ceiling 8 hops
          - one-byte path mode
          - V19 radio defaults: 869.618 MHz / 62.5 kHz / SF8 / CR5 / 22 dBm
          - fixed 32-packet pool
          - queue drop/high-water diagnostics
          - congestion-aware periodic adverts
          - conservative 120-second hard-stall recovery
          - safe preferences transaction/rollback
          - nRF52 power-saving enabled on fresh installs
          - GPS not forced on
          - no automatic bootloader update

          This is a prerelease until physical T-Deck V19 <-> P1 Pro acceptance testing is complete.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG"               --title "$RELEASE_NAME"               --notes-file release-notes.md               --prerelease
          else
            gh release create "$RELEASE_TAG"               --target "$GITHUB_SHA"               --title "$RELEASE_NAME"               --notes-file release-notes.md               --prerelease
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber
