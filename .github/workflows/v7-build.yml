name: V7 Saitama Hybrid Build

on:
  push:
    branches:
      - v7-saitama-hybrid-dev
    paths:
      - 'v7-overlay/**'
      - 'v7/**'
      - '.github/workflows/v7-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-firmware
  cancel-in-progress: true

jobs:
  build-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V7 control repository
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1

      - name: Checkout exact Saitama v1.3.0
        uses: actions/checkout@v4
        with:
          repository: 868meshbot/Saitama
          ref: v1.3.0
          path: saitama
          submodules: recursive
          fetch-depth: 0

      - name: Verify locked upstream provenance
        shell: bash
        run: |
          set -euo pipefail
          SAITAMA_SHA="$(git -C saitama rev-parse HEAD)"
          MESHCORE_SHA="$(git -C saitama/lib/MeshCore rev-parse HEAD)"
          test "$SAITAMA_SHA" = "16598b4e6a7eabd6195d06d2a3abc1b3b448f368"
          test "$MESHCORE_SHA" = "d92964352441e53b93e8667b802e04f6e072b39e"
          echo "Saitama=$SAITAMA_SHA"
          echo "MeshCore=$MESHCORE_SHA"

      - name: Apply Version 7 overlay
        run: |
          python control/v7-overlay/apply_v7.py saitama control/v7-overlay
          grep -q 'OPS_VERSION_STRING "7.0.0"' saitama/src/version.h
          grep -q 'ESP-NOW LR ready' saitama/src/mesh/MeshService.cpp
          test -f saitama/src/mesh/HybridTransport.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.piocache
          key: ${{ runner.os }}-v7-pio-${{ hashFiles('saitama/platformio.ini', 'saitama/src/mesh/HybridTransport.*') }}
          restore-keys: |
            ${{ runner.os }}-v7-pio-

      - name: Build one T-Deck Plus target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.piocache
          export PLATFORMIO_BUILD_CACHE_DIR=~/.piocache
          cd saitama
          pio run -e t-deck

      - name: Verify and describe artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd saitama
          APP="firmware/saitama-t-deck-plus-7.0.0.bin"
          MERGED="firmware/saitama-t-deck-plus-7.0.0-merged.bin"
          test -s "$APP"
          test -s "$MERGED"
          python -m esptool --chip esp32s3 image_info .pio/build/t-deck/bootloader.bin > ../v7-image-info.txt
          {
            echo "version=7.0.0"
            echo "upstream_saitama=16598b4e6a7eabd6195d06d2a3abc1b3b448f368"
            echo "meshcore=d92964352441e53b93e8667b802e04f6e072b39e"
            echo "target=t-deck-plus"
            echo "flash_size=16MB"
            echo "flash_mode=dio"
            stat -c "app_bytes=%s" "$APP"
            stat -c "merged_bytes=%s" "$MERGED"
            sha256sum "$APP" | awk '{print "app_sha256="$1}'
            sha256sum "$MERGED" | awk '{print "merged_sha256="$1}'
          } | tee ../v7-release-metadata.txt

      - name: Upload V7 firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: meshoffgridnl-v7-firmware
          if-no-files-found: error
          retention-days: 90
          path: |
            saitama/firmware/saitama-t-deck-plus-7.0.0.bin
            saitama/firmware/saitama-t-deck-plus-7.0.0-merged.bin
            v7-release-metadata.txt
            v7-image-info.txt
