name: P1 Pro V2 RC1 Release

on:
  push:
    branches:
      - p1-pro-v2-phase3-release
    paths:
      - "p1pro-v2/**"
      - ".github/workflows/p1-pro-v2-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meshoffgridnl-firmware-build
  cancel-in-progress: false

env:
  MESHCORE_COMMIT: e94125987ed87497e706a0b54d1e80c709343980
  TARGET: SenseCap_Solar_repeater
  RELEASE_TAG: p1pro-v2.0.0-rc1
  RELEASE_NAME: MeshOffGridNL P1 Pro V2 RC1

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout firmware workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned MeshCore
        run: |
          rm -rf upstream-meshcore
          git clone https://github.com/meshcore-dev/MeshCore.git upstream-meshcore
          cd upstream-meshcore
          git checkout "$MESHCORE_COMMIT"
          test "$(git rev-parse HEAD)" = "$MESHCORE_COMMIT"

      - name: Apply proven V1 substrate
        run: |
          python p1pro-v1/apply_p1pro_v1.py upstream-meshcore
          python p1pro-v1/tests/test_contracts.py upstream-meshcore
          python p1pro-v1/apply_phase2.py upstream-meshcore
          python p1pro-v1/tests/test_phase2.py upstream-meshcore

      - name: Apply V2 Phase 1 EU868 Adaptive Mesh
        run: |
          python p1pro-v2/apply_phase1.py upstream-meshcore
          python p1pro-v2/tests/test_phase1.py upstream-meshcore

      - name: Apply V2 Phase 2 Solar Trust
        run: |
          python p1pro-v2/apply_phase2.py upstream-meshcore
          python p1pro-v2/tests/test_phase2.py upstream-meshcore

      - name: Install pinned PlatformIO
        run: python -m pip install "platformio==6.2.0"

      - name: Build official nRF52 output set
        env:
          FIRMWARE_VERSION: p1pro-v2.0.0-rc1
        run: |
          cd upstream-meshcore
          bash build.sh build-firmware "$TARGET"
          ls -lah out/
          test -n "$(find out -maxdepth 1 -name 'SenseCap_Solar_repeater-*.uf2' -print -quit)"
          test -n "$(find out -maxdepth 1 -name 'SenseCap_Solar_repeater-*.zip' -print -quit)"

      - name: Package V2 RC1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          UF2="$(find upstream-meshcore/out -maxdepth 1 -name 'SenseCap_Solar_repeater-*.uf2' -print -quit)"
          DFU="$(find upstream-meshcore/out -maxdepth 1 -name 'SenseCap_Solar_repeater-*.zip' -print -quit)"
          test -f "$UF2"
          test -f "$DFU"

          cp "$UF2" dist/MeshOffGridNL-P1-Pro-V2-RC1.uf2
          cp "$DFU" dist/MeshOffGridNL-P1-Pro-V2-RC1.zip

          curl --fail --location --retry 3             "https://flasher.meshcore.io/firmware/FLASH_ERASE_nrf52_softdevice_v7.zip"             -o dist/FLASH_ERASE_nrf52_softdevice_v7.zip
          unzip -t dist/FLASH_ERASE_nrf52_softdevice_v7.zip

          tar             --exclude='.git'             --exclude='.pio'             --exclude='out'             -czf dist/MeshOffGridNL-P1-Pro-V2-RC1-source.tar.gz             upstream-meshcore p1pro-v1 p1pro-v2

          python - <<'PY'
          import hashlib, json, os, pathlib

          d = pathlib.Path("dist")
          files = [
              d / "MeshOffGridNL-P1-Pro-V2-RC1.zip",
              d / "MeshOffGridNL-P1-Pro-V2-RC1.uf2",
              d / "FLASH_ERASE_nrf52_softdevice_v7.zip",
              d / "MeshOffGridNL-P1-Pro-V2-RC1-source.tar.gz",
          ]

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          manifest = {
              "schema": 2,
              "product": "MeshOffGridNL P1 Pro V2",
              "release": "RC1",
              "stable": False,
              "board": "seeed-sensecap-solar-node-p1",
              "compatibleHardware": [
                  "Seeed Studio SenseCAP Solar Node P1",
                  "Seeed Studio SenseCAP Solar Node P1 Pro"
              ],
              "target": os.environ["TARGET"],
              "mcu": "nRF52840",
              "radio": "SX1262",
              "protocol": "MeshCore",
              "role": "adaptive-solar-base-station",
              "meshcoreCommit": os.environ["MESHCORE_COMMIT"],
              "workspaceCommit": os.environ["GITHUB_SHA"],
              "v1FallbackTag": "p1pro-v1.0.0-rc1",
              "radioProfile": {
                  "band": "EU868-only",
                  "frequencyMHz": 869.618,
                  "bandwidthKHz": 62.5,
                  "spreadingFactor": 8,
                  "codingRate": 5,
                  "txPowerCeilingDbm": 22,
                  "locked": True
              },
              "routing": {
                  "scopedFloodMax": 48,
                  "unscopedFloodMax": 6,
                  "advertFloodMax": 8,
                  "pathHashBytes": 1,
                  "policy": "48-is-a-ceiling-not-a-target"
              },
              "adaptiveMesh": {
                  "normalDutyCyclePercent": 10,
                  "busyDutyCyclePercent": 5,
                  "congestedDutyCyclePercent": 2,
                  "severeDutyCyclePercent": 1,
                  "cadAuto": True,
                  "recoveryQuietSeconds": 30,
                  "packetPool": 32
              },
              "solarGuardian": {
                  "ecoMv": 3600,
                  "ecoRecoverMv": 3700,
                  "criticalMv": 3450,
                  "criticalRecoverMv": 3550,
                  "protectMv": 3300,
                  "protectSamples": 2,
                  "powerCheckMs": 30000,
                  "wake": "LPCOMP+VBUS"
              },
              "trust": {
                  "replacePublishedDefaultAdmin": True,
                  "preserveExistingCredential": True,
                  "perDeviceRandomCredential": True
              },
              "recovery": {
                  "softRadioRecoveryMs": 60000,
                  "hardRebootNoProgressMs": 120000,
                  "safePrefsTransaction": True
              },
              "installer": {
                  "type": "nrf52-dfu",
                  "oneClickFlow": True,
                  "factoryCleanDefault": True,
                  "eraseFile": "FLASH_ERASE_nrf52_softdevice_v7.zip",
                  "flashFile": "MeshOffGridNL-P1-Pro-V2-RC1.zip",
                  "uf2Fallback": "MeshOffGridNL-P1-Pro-V2-RC1.uf2",
                  "automaticBootloaderUpgrade": False
              },
              "artifacts": [
                  {"file": p.name, "size": p.stat().st_size, "sha256": sha256(p)}
                  for p in files
              ]
          }

          (d / "p1-pro-v2-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          print(json.dumps(manifest, indent=2))
          PY

          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Validate V2 release contract
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          d = pathlib.Path("dist")
          m = json.loads((d / "p1-pro-v2-manifest.json").read_text())

          assert m["schema"] == 2
          assert m["product"] == "MeshOffGridNL P1 Pro V2"
          assert m["stable"] is False
          assert m["target"] == "SenseCap_Solar_repeater"
          assert m["mcu"] == "nRF52840"
          assert m["radio"] == "SX1262"
          assert m["radioProfile"] == {
              "band": "EU868-only",
              "frequencyMHz": 869.618,
              "bandwidthKHz": 62.5,
              "spreadingFactor": 8,
              "codingRate": 5,
              "txPowerCeilingDbm": 22,
              "locked": True
          }
          assert m["routing"]["scopedFloodMax"] == 48
          assert m["routing"]["unscopedFloodMax"] == 6
          assert m["routing"]["advertFloodMax"] == 8
          assert m["installer"]["oneClickFlow"] is True
          assert m["installer"]["automaticBootloaderUpgrade"] is False
          assert m["solarGuardian"]["protectMv"] == 3300
          assert m["trust"]["perDeviceRandomCredential"] is True

          for item in m["artifacts"]:
              p = d / item["file"]
              assert p.exists(), item["file"]
              assert p.stat().st_size == item["size"], item["file"]
              assert hashlib.sha256(p.read_bytes()).hexdigest() == item["sha256"], item["file"]

          print("P1 Pro V2 RC1 release contract OK")
          PY

      - name: Publish V2 RC1 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          MeshOffGridNL P1 Pro V2 RC1

          EU868-only autonomous solar base-station candidate for SenseCAP Solar Node P1/P1 Pro.

          V2 adds:
          - hard-locked V19-compatible 869.618 MHz / 62.5 kHz / SF8 / CR5 profile
          - 22 dBm TX ceiling
          - adaptive 10% -> 5% -> 2% -> 1% airtime policy under pressure
          - adaptive CAD with hysteresis
          - 48/6/8 scoped/unscoped/advert hop ceilings
          - fixed 32-packet pool
          - Solar Guardian with 3300 mV protection and LPCOMP/VBUS recovery
          - per-device random admin credential when upstream default is still active
          - staged soft radio recovery before hard reboot
          - safe config transaction/rollback
          - one-click web installer contract with UF2 fallback
          - no automatic bootloader update

          RC1 remains a prerelease until physical P1 Pro <-> T-Deck V19 acceptance testing passes.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG"               --title "$RELEASE_NAME"               --notes-file release-notes.md               --prerelease
          else
            gh release create "$RELEASE_TAG"               --target "$GITHUB_SHA"               --title "$RELEASE_NAME"               --notes-file release-notes.md               --prerelease
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber
