name: V30 isolated module validation
on:
  push:
    branches: [v30-pro-meshmap-nano]
    paths: ["v30/**", ".github/workflows/v30_modules_validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test emergency envelope framing
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I v30/overlay/src/helpers/esp32 v30/tests/test_envelope_layout.cpp v30/overlay/src/helpers/esp32/V30EnvelopeLayout.cpp -o /tmp/v30-envelope
          /tmp/v30-envelope
      - name: Test MeshMap Nano development pack
        run: python -m unittest discover -s v30/tests -p test_map_build.py -v
      - name: Test conservative airtime accounting
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I v30/overlay/src/helpers/esp32 v30/tests/test_airtime.cpp v30/overlay/src/helpers/esp32/V30AirtimeGovernor.cpp -o /tmp/v30-airtime
          /tmp/v30-airtime
      - name: Test guarded channel onboarding contract
        run: |
          python -m unittest discover -s v30/tests -p test_channel_direct_join.py -v
          python -m unittest discover -s v30/tests -p test_apply_channel_v30.py -v
      - name: Test read-only installer validation
        run: python -m unittest discover -s v30/tests -p test_verify_install_manifest.py -v
      - name: Test bounded durable journal and corruption rejection
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic v30/overlay/src/helpers/esp32/V30Journal.cpp v30/tests/test_delivery.cpp -o /tmp/v30-journal
          /tmp/v30-journal
      - name: Test V30 browser WebSocket framing
        run: |
          python v30/tests/browser_frames/prepare_term_fixture.py /tmp/term_fixture.inc
          c++ -std=c++17 -Wall -Wextra -Werror -I /tmp v30/tests/browser_frames/test_term.cpp -o /tmp/v30-term
          /tmp/v30-term
      - name: Test isolated V30 relay contract
        run: node --test v30/relay/test_v30_relay.mjs
