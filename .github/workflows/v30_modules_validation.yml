name: V30 isolated module validation
on:
  push:
    branches: [v30-pro-meshmap-nano]
    paths: ["v30/**", ".github/workflows/v30_modules_validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test emergency envelope framing
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I v30/overlay/src/helpers/esp32 v30/tests/test_envelope_layout.cpp v30/overlay/src/helpers/esp32/V30EnvelopeLayout.cpp -o /tmp/v30-envelope
          /tmp/v30-envelope
      - name: Test MeshMap Nano development pack
        run: python -m unittest discover -s v30/tests -p test_map_build.py -v
      - name: Test conservative airtime accounting
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I v30/overlay/src/helpers/esp32 v30/tests/test_airtime.cpp v30/overlay/src/helpers/esp32/V30AirtimeGovernor.cpp -o /tmp/v30-airtime
          /tmp/v30-airtime
      - name: Test guarded channel onboarding contract
        run: |
          python -m unittest discover -s v30/tests -p test_channel_direct_join.py -v
          python -m unittest discover -s v30/tests -p test_apply_channel_v30.py -v
      - name: Test read-only installer validation
        run: python -m unittest discover -s v30/tests -p test_verify_install_manifest.py -v
      - name: Test bounded durable journal and corruption rejection
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic v30/overlay/src/helpers/esp32/V30Journal.cpp v30/tests/test_delivery.cpp -o /tmp/v30-journal
          /tmp/v30-journal
      - name: Test V30 browser WebSocket framing
        run: |
          python v30/tests/browser_frames/prepare_term_fixture.py /tmp/term_fixture.inc
          c++ -std=c++17 -Wall -Wextra -Werror -I /tmp v30/tests/browser_frames/test_term.cpp -o /tmp/v30-term
          /tmp/v30-term
      - name: Test isolated V30 relay contract
        run: node --test v30/relay/test_v30_relay.mjs
      - name: Test OSM source ingestion and province assignment
        run: python -m unittest discover -s v30/tests -p test_osm_ingest.py -v
      - name: Test native MeshMap metadata, search and streaming geometry
        run: |
          python v30/tests/generate_reader_fixture.py /tmp/reader-fixture.meshmap
          cc -O2 -c v30/overlay/src/ui-touch/miniz/miniz_tinfl.c -o /tmp/tinfl.o
          c++ -std=c++17 -Wall -Wextra -Werror v30/overlay/src/ui-touch/NanoMapPack.cpp v30/tests/test_map_pack.cpp /tmp/tinfl.o -lz -o /tmp/test_map_pack
          /tmp/test_map_pack /tmp/reader-fixture.meshmap
      - name: Test bounded portal request and approval contract
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic v30/tests/test_portal_request.cpp -o /tmp/v30-portal
          /tmp/v30-portal
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic v30/tests/test_portal_approval.cpp -o /tmp/v30-approval
          /tmp/v30-approval
      - name: Test signed relay device authorization
        run: node --test v30/relay/test_v30_grant_adapter.mjs
      - name: Test actual relay HTTP two-client and restart contract
        run: node --test v30/relay/test_v30_http.mjs
      - name: Test real durable file journal backend
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I. v30/overlay/src/helpers/esp32/V30Journal.cpp v30/overlay/src/helpers/esp32/V30FileJournalStorage.cpp v30/tests/test_journal_storage.cpp -o /tmp/v30-file-journal
          /tmp/v30-file-journal /tmp/v30-journal.bin
      - name: Test detached publisher signature and read-only install gate
        run: |
          python -m pip install 'cryptography==50.0.0'
          python -m unittest discover -s v30/tests -p test_signed_install_manifest.py -v
      - name: Test challenge-bound same-key private channel relay grants
        run: node --test v30/relay/test_v30_network_grant.mjs v30/relay/test_v30_channel_credential.mjs

      - name: Test actual native private-channel behavior and raw flash guard
        run: |
          python -m unittest discover -s v30/tests -p test_channel_native_behavior.py -v
          python v30/tests/test_apply_map_guard.py
          c++ -std=c++17 -Wall -Wextra -Werror -I v30/overlay/src/ui-touch v30/overlay/src/ui-touch/NanoMapPack.cpp v30/overlay/src/ui-touch/NanoMapImage.cpp v30/tests/test_nano_image.cpp /tmp/tinfl.o -lz -o /tmp/v30-image
          /tmp/v30-image /tmp/reader-fixture.meshmap
      - name: Test bounded map viewport geometry, cancellation and generation
        run: |
          base=v30/overlay/src/ui-touch
          c++ -std=c++17 -Wall -Wextra -Werror -I "$base" "$base/NanoMapPack.cpp" "$base/NanoMapViewport.cpp" v30/tests/test_nano_viewport.cpp /tmp/tinfl.o -lz -o /tmp/v30-view
          /tmp/v30-view /tmp/reader-fixture.meshmap
      - name: Test reproducible unsigned development package assembly
        run: python -m unittest discover -s v30/tests -p test_build_dev_package.py -v
      - name: Test authenticated two-client relay over actual verified TLS
        run: node --test v30/relay/test_v30_tls.mjs
      - name: Test browser pairing parser and authorization in embedded C++ dialect
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I v30/overlay/src/helpers/esp32 v30/tests/browser_auth/test_session.cpp -o /tmp/v30-browser-test
          /tmp/v30-browser-test
      - name: Test native bounded presentation and map trust pin
        run: |
          base=v30/overlay/src/ui-touch
          c++ -std=c++11 -Wall -Wextra -Werror -DMESH_OFFGRIDNL_NANOMAP_HOST_TEST -I "$base" "$base/NanoMapPresentation.cpp" "$base/NanoMapTrustPin.cpp" v30/tests/test_nano_present.cpp -lcrypto -o /tmp/v30-present
          /tmp/v30-present
          python v30/tests/test_apply_map_native.py
