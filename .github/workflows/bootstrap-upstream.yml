name: Bootstrap Meshtastic upstream

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official Meshtastic firmware develop branch
        run: |
          set -euo pipefail
          git config user.name "MeshOffGrid XR Bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/meshtastic/firmware.git || true
          git fetch --depth=1 upstream develop
          git checkout -B upstream-develop upstream/develop
          git push origin upstream-develop --force

      - name: Verify imported upstream branch
        run: |
          git ls-remote --exit-code --heads origin upstream-develop
