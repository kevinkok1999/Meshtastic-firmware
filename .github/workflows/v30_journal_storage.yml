name: V30 journal storage C++ host tests
on:
  push:
    branches: [v30-work-journal-storage]
    paths: ["v30/overlay/src/helpers/esp32/V30Journal*", "v30/tests/test_journal_storage.cpp", ".github/workflows/v30_journal_storage.yml"]
  pull_request:
    branches: [v30-work-journal-storage]
    paths: ["v30/overlay/src/helpers/esp32/V30Journal*", "v30/tests/test_journal_storage.cpp", ".github/workflows/v30_journal_storage.yml"]
permissions: {contents: read}
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I. v30/overlay/src/helpers/esp32/V30Journal.cpp v30/overlay/src/helpers/esp32/V30FileJournalStorage.cpp v30/tests/test_journal_storage.cpp -o journal_test
      - run: ./journal_test /tmp/v30-journal.bin
