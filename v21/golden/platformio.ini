[platformio]
default_envs = golden-old

[golden_common]
framework = arduino
board = t-deck
monitor_speed = 115200
build_flags =
  -D GOLDEN_WIFI_SSID='"MeshOffGrid21"'
  -D GOLDEN_WIFI_PASS='"MeshOffGrid21Test"'
  -D MESH_OFFGRIDNL_V21_GOLDEN=1

[env:golden-old]
extends = golden_common
platform = platformio/espressif32@6.11.0
build_flags =
  ${golden_common.build_flags}
  -D GOLDEN_STACK_NAME='"legacy-pio-6.11.0"'

[env:golden-modern]
extends = golden_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
build_flags =
  ${golden_common.build_flags}
  -D GOLDEN_STACK_NAME='"modern-pioarduino-stable"'
